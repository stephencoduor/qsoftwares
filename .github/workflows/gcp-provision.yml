name: Provision GCP server

# Run by hand from the Actions tab. Creates or updates the free-tier e2-micro that serves
# qsoftwares.org and stores the Zoho SMTP login in Google Secret Manager.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcp-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Create or update the server
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        run: |
          bash deploy/gcp/create-vm.sh | tee provision.log
          IP="$(sed -n 's/^SERVER_IP=//p' provision.log)"
          {
            echo "## Server ready"
            echo
            echo "Point these DNS records at **$IP**, replacing the GitHub Pages ones:"
            echo
            echo "| Name | Type | Value |"
            echo "| --- | --- | --- |"
            echo "| qsoftwares.org | A | $IP |"
            echo "| www.qsoftwares.org | A | $IP |"
          } >> "$GITHUB_STEP_SUMMARY"
